# ─────────────────────────────────────────────────────────────
#  PUBLICATIONS
#  Each publication starts with "- id:". To add one, copy a whole
#  block, paste it at the top of the list and edit it.
#
#  type must be one of:
#    journal        – peer-reviewed journal article
#    conference     – conference paper / proceedings
#    chapter        – book chapter or other scholarly contribution
#    working-paper  – working paper or manuscript
#    thesis         – thesis or dissertation
#
#  Optional lines (delete if not needed): volume, issue, pages, doi,
#  url, pdf, summary, featured.
#  doi: write only the DOI itself (10.xxxx/...), not the full link.
#  pdf: put the PDF in public/documents/ and write "/documents/name.pdf"
#  featured: true  → also shown on the home page
#  Opinion articles go in src/content/articles/ instead.
# ─────────────────────────────────────────────────────────────

