# Home page "Profile" section (a few short paragraphs; blank line between paragraphs)
intro: |
  I am a lecturer at Boston International College in Bharatpur, Chitwan, where I teach entrepreneurship, operations and the business environment through workshops, real cases and startup simulations. As an early-career researcher, I ask how entrepreneurship can be taught well and how startup ecosystems grow in Nepal. I have published in peer-reviewed journals and am working on several manuscripts.

  For five years I served as Assistant Director of BIC Startups, the college's business incubation centre. I led five incubation cohorts in which more than 130 students in over 30 teams generated startup ideas, built prototypes and pitched them. More than ten teams went on to further incubation with financial support and mentoring, and five were selected for funding from the University Grants Commission (UGC) Nepal.

  I also work where industry and academia meet. As focal person for the college's Industry Connect program, I helped sign collaboration agreements with more than seven institutions and organised industry–academia dialogues, guest sessions by industry experts, industrial visits, internships and job placements. I have advised the student-led Boston Center for Entrepreneurship and Leadership, led soft-skills training, and spoken, facilitated workshops and served on panels on entrepreneurship, innovation and industry–academia partnership.

  I hold a Master of Management in Entrepreneurship and Innovation from La Trobe University, Melbourne, and have taken part in research conferences, professional conferences and bootcamps in Australia, Thailand and Nepal.

