# The home-page introduction (a few short paragraphs; blank line between paragraphs)
intro: |
  I am a lecturer at Boston International College in Bharatpur, Chitwan, Nepal, and an early-career researcher in entrepreneurship. My work asks how entrepreneurship can be taught well and how startup ecosystems grow in Nepal.

  From 2019 to 2024 I led BIC Startups, the college's business incubation program, and coordinated its Industry Connect program with local industry and government. I hold a Master of Management in Entrepreneurship and Innovation from La Trobe University, Melbourne.

